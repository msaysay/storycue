name: Publish StoryCue 0.1.1 configuration fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/storycue-update.yml']
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'msaysay/storycue' && github.actor == 'msaysay'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify reviewed patch and previous file hashes
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,zipfile
          root=pathlib.Path.cwd().resolve()
          archive=root/'storycue-update-0.1.1.zip'
          assert hashlib.sha256(archive.read_bytes()).hexdigest()=='6d91294a4269c6adf8254fd30b9a920f37ff588d4799356afb0caf2306be5ba8', 'Patch checksum mismatch'
          with zipfile.ZipFile(archive)as z:
              manifest=json.loads(z.read('patch-manifest.json'))
              assert len(manifest)==16, 'Unexpected patch size'
              assert set(z.namelist())=={'patch-manifest.json'}|{'StoryCue/'+p for p in manifest}, 'Unexpected members'
              targets=[]
              for name,expected in manifest.items():
                  parts=pathlib.PurePosixPath(name).parts
                  assert parts and not any(p in ('..','.git','node_modules','.storycue-data','.storycue-work') for p in parts)
                  assert not any(p.startswith('.env') and p!='.env.example' for p in parts)
                  target=root.joinpath(*parts).resolve()
                  assert target.is_relative_to(root) and target.is_file(), 'Unexpected target'
                  assert hashlib.sha256(target.read_bytes()).hexdigest()==expected, 'Source changed; stop instead of overwriting'
                  targets.append((target,z.read('StoryCue/'+name)))
              for target,content in targets:target.write_bytes(content)
          archive.unlink()
          (root/'.github/workflows/storycue-update.yml').unlink()
          print('Verified patch applied; temporary bootstrap removed')
          PY
      - name: Commit reviewed fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Clarify independent speech and text setup; fix desktop-agent waiting UX (0.1.1)'
          git push origin HEAD:main
