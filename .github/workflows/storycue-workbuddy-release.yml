name: Publish StoryCue v0.2.1 WorkBuddy CLI repair
on:
  push:
    branches: [main]
    paths: ['.github/workflows/storycue-workbuddy-release.yml']
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'msaysay/storycue' && github.actor == 'msaysay'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 3
      - name: Verify reviewed patch and previous public files
        run: |
          test "$(git rev-parse HEAD~2)" = 'fafddfd396c019043a8d6febd9a1f9a4a1950ce0'
          python3 - <<'PY'
          import hashlib,json,pathlib,zipfile
          root=pathlib.Path.cwd().resolve()
          archive=root/'storycue-workbuddy-0.2.1.zip'
          assert hashlib.sha256(archive.read_bytes()).hexdigest()=='930aaedc1d732d34721b21ce308566b555ae11f4ec165ca43c7257e431bf83f4', 'Patch checksum mismatch'
          with zipfile.ZipFile(archive)as z:
              manifest=json.loads(z.read('patch-manifest.json'))
              assert len(manifest)==11, 'Unexpected patch size'
              assert set(z.namelist())=={'patch-manifest.json'}|{'StoryCue/'+p for p in manifest}, 'Unexpected members'
              targets=[]
              for name,expected in manifest.items():
                  parts=pathlib.PurePosixPath(name).parts
                  assert parts and not any(p in ('..','.git','node_modules','.storycue-data','.storycue-work') for p in parts)
                  assert not any(p.startswith('.env') and p!='.env.example' for p in parts)
                  target=root.joinpath(*parts).resolve()
                  assert target.is_relative_to(root), 'Invalid target'
                  if expected is None: assert not target.exists(), 'New file already exists'
                  else: assert target.is_file() and hashlib.sha256(target.read_bytes()).hexdigest()==expected, 'Source changed; refusing overwrite'
                  targets.append((target,z.read('StoryCue/'+name)))
              for target,content in targets:
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(content)
          archive.unlink()
          (root/'.github/workflows/storycue-workbuddy-release.yml').unlink()
          print('Verified automatic-planning source applied; temporary publisher removed')
          PY
      - name: Commit tested source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Release 0.2.1: fix native WorkBuddy CLI selection and verify real model calls'
          git push origin HEAD:main
      - name: Publish version and clean source download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git ls-files | wc -l)" -eq 94
          git archive --format=zip --prefix=StoryCue/ -o "$RUNNER_TEMP/StoryCue-v0.2.1-source.zip" HEAD
          cat > "$RUNNER_TEMP/storycue-release-notes.md" <<'NOTES'
          ## Fix WorkBuddy question generation

          WorkBuddy installations could select the App's embedded lite CLI, show configured=true, and still fail to generate questions. This release installs a pinned official full CodeBuddy CLI in the project and prefers that entry. Desktop-internal profile and bundle flags are isolated. No App tokens are extracted or copied.

          Upgrade: preserve .env.local, .storycue-data and browser interview records; update source AND skills/storycue/SKILL.md; run npm ci, npm run desktop:connect -- --host workbuddy, and npm run desktop:doctor. If doctor reports unauthenticated, complete npm run desktop:login once and rerun doctor. Restart StoryCue only when no interview is active. Codex users use --host codex.

          desktop:doctor now really calls the selected account/model and validates a 3-5-question outline. Merely finding the CLI or receiving HTTP 200 is no longer installation acceptance. The setup page distinguishes entry discovery from recent model verification. Also fixes npm Codex wrapper resolution. Speech and immediate follow-up remain independent BYOK services; main questions do not silently fall back to an API.

          Validation details are in README. The published package contains no publisher credentials, CLI auth, interview history or node_modules. The official CLI is downloaded by npm under its own license and service terms.

          NOTES
          gh release create v0.2.1 "$RUNNER_TEMP/StoryCue-v0.2.1-source.zip" --target "$(git rev-parse HEAD)" --title 'StoryCue v0.2.1 - WorkBuddy CLI repair' --notes-file "$RUNNER_TEMP/storycue-release-notes.md"
