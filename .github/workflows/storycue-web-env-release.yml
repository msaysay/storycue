# STORYCUE_PATCH_BASE64:
name: Publish StoryCue v0.2.2 native WorkBuddy web fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/storycue-web-env-release.yml']
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'msaysay/storycue' && github.actor == 'msaysay'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Verify and apply reviewed source
        run: |
          test "$(git rev-parse HEAD~1)" = 'bdbe782af3c33ab58db7b7fbfb7dc2696a6f9f93'
          python3 - <<'PY'
          import base64,hashlib,io,json,pathlib,zipfile
          root=pathlib.Path.cwd().resolve()
          publisher=root/'.github/workflows/storycue-web-env-release.yml'
          marker='# STORYCUE_PATCH_BASE64:'
          payload=next(line[len(marker):] for line in publisher.read_text().splitlines() if line.startswith(marker))
          patch=base64.b64decode(payload,validate=True)
          assert hashlib.sha256(patch).hexdigest()=='79392235ab196bb284724994108faa4db5c1a8d287f88941fe0b35266efe44ce', 'Patch checksum mismatch'
          with zipfile.ZipFile(io.BytesIO(patch))as z:
              manifest=json.loads(z.read('patch-manifest.json'))
              assert len(manifest)==8, 'Unexpected patch size'
              assert set(z.namelist())=={'patch-manifest.json'}|{'StoryCue/'+p for p in manifest}, 'Unexpected members'
              targets=[]
              for name,expected in manifest.items():
                  parts=pathlib.PurePosixPath(name).parts
                  assert parts and not any(p in ('..','.git','node_modules','.storycue-data','.storycue-work') for p in parts)
                  assert not any(p.startswith('.env') and p!='.env.example' for p in parts)
                  target=root.joinpath(*parts).resolve()
                  assert target.is_relative_to(root), 'Invalid target'
                  if expected is None: assert not target.exists(), 'New file already exists'
                  else: assert target.is_file() and hashlib.sha256(target.read_bytes()).hexdigest()==expected, 'Source changed; refusing overwrite'
                  targets.append((target,z.read('StoryCue/'+name)))
              for target,content in targets:
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(content)
          (root/'.github/workflows/storycue-web-env-release.yml').unlink()
          print('Reviewed source verified and applied; temporary publisher removed')
          PY
      - name: Commit native-tested source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Release 0.2.2: isolate Next environment for native WorkBuddy planning'
          git push origin HEAD:main
      - name: Publish release and clean source download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git ls-files | wc -l)" -eq 94
          git archive --format=zip --prefix=StoryCue/ -o "$RUNNER_TEMP/StoryCue-v0.2.2-source.zip" HEAD
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          ## Native WorkBuddy question generation verified

          Fixes a second cause of misleading authentication errors: Next.js NODE_ENV was inherited by the independent official CLI. CLI login, doctor and web planning now share the same standalone environment. No new model API key or repeated login is required for this fix.

          Verified in Windows WorkBuddy 5.9.0 using its own launch environment and built-in browser: enter the topic, click Generate, receive four real CLI-generated questions, edit one, refresh and retain the edit. No hand-written JSON, manual submit or injected browser state. Microphone and phone audio were not tested in this round.

          All 15 published regression tests, 21 related development regressions, TypeScript, targeted lint and production build passed. Regression covers both development and production parent environments. Main questions remain separate from BYOK speech and immediate follow-up services.

          Upgrade from 0.2.1: preserve .env.local, .storycue-data, the valid CLI bridge and browser interview records; update source AND skills/storycue/SKILL.md; restart StoryCue (rebuild first for production), then run desktop:doctor and test Generate in the webpage. Dependencies are unchanged. Do not reset a valid login, model or explicit config directory. Older lite-entry installations still need the complete CLI connection described in README.

          Open URLs in WorkBuddy's real browser tab, not a local-file preview. Initial next dev compilation may exceed a five-second health probe. Finding an entry, HTTP 200 or doctor alone does not replace the actual webpage test.

          This source package contains no publisher credentials, CLI account files, interview history or node_modules. Previous versions remain available for rollback.
          NOTES
          gh release create v0.2.2 "$RUNNER_TEMP/StoryCue-v0.2.2-source.zip" --target "$(git rev-parse HEAD)" --title 'StoryCue v0.2.2 - Native WorkBuddy web fix' --notes-file "$RUNNER_TEMP/release-notes.md"
