name: Publish audited StoryCue source
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bootstrap.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'msaysay/storycue' && github.actor == 'msaysay'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify and expand the reviewed release, preserving paths
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, zipfile
          root = pathlib.Path.cwd().resolve()
          archive = root / 'storycue-source.zip'
          expected = 'c92b33bb5bedc86b1dfb94883a22c36e62865180b15631da0df943a20b39de68'
          if hashlib.sha256(archive.read_bytes()).hexdigest() != expected:
              raise SystemExit('Release checksum mismatch; nothing extracted')
          with zipfile.ZipFile(archive) as z:
              files = [i for i in z.infolist() if not i.is_dir()]
              if len(files) != 90:
                  raise SystemExit('Unexpected source count')
              for info in files:
                  parts = pathlib.PurePosixPath(info.filename).parts
                  if not parts or parts[0] != 'StoryCue' or any(x in ('..', '.git', 'node_modules', '.storycue-data', '.storycue-work') for x in parts):
                      raise SystemExit('Invalid archive path')
                  if any(x.startswith('.env') and x != '.env.example' for x in parts):
                      raise SystemExit('Private environment file is forbidden')
                  target = root.joinpath(*parts[1:]).resolve()
                  if not target.is_relative_to(root):
                      raise SystemExit('Archive traversal blocked')
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read(info))
          archive.unlink()
          (root / '.github/workflows/bootstrap.yml').unlink()
          print('Verified and published 90 audited files; one-time bootstrap removed.')
          PY
      - name: Commit the public source tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Publish StoryCue v0.1.0 source, visual README and tested desktop-agent workflow'
          git push origin HEAD:main
